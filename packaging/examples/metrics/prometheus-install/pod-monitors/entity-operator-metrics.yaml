---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: entity-operator-metrics
  labels:
    app: strimzi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: entity-operator
  namespaceSelector:
    matchNames:
      - metrics-test-0
      - metrics-test-1
  podMetricsEndpoints:
  - path: /metrics
    port: healthcheck-to
  - path: /metrics
    port: healthcheck-uo
